<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intelligent Crab Guy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <div class="app-shell">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">🦀</span>
        <h1>Intelligent Crab Guy</h1>
      </div>
      <nav class="topbar-nav">
        <a href="#" class="topbar-link active">Chat</a>
        <a href="#" class="topbar-link">Settings</a>
        <a href="/logout" class="topbar-link logout">Logout</a>
      </nav>
      <!-- Mobile hamburger -->
      <button class="menu-toggle" id="menu-toggle" aria-label="Open menu">☰</button>
    </header>

    <!-- MAIN LAYOUT: sidebar + chat -->
    <main class="layout">

      <!-- SIDEBAR: chat history (desktop only, hidden on mobile) -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>History</h2>
          <span class="badge" id="history-badge">0</span>
        </div>
        <div class="history-list" id="history-list">
          <p class="history-empty">No conversations yet.</p>
        </div>
        <button class="new-chat-btn" id="new-chat-btn">+ New Chat</button>
      </aside>

      <!-- CHAT PANEL -->
      <section class="chat-panel">
        <div class="chat-header">
          <h2>Ask me anything</h2>
          <span class="status-pill">🟢 Online</span>
        </div>
        <div class="chat-window" id="chat-window"></div>
      </section>

    </main>

    <!-- INPUT BAR -->
    <footer class="prompt-panel">
      <div class="prompt-form">
        <label for="prompt-input" class="sr-only">Enter your message</label>
        <textarea id="prompt-input" rows="2" placeholder="Ask the crab something..."></textarea>
        <button type="button" id="send-btn">Send</button>
      </div>
    </footer>

  </div>

  <!-- MOBILE SLIDE-OUT MENU -->
  <div class="menu-overlay" id="menu-overlay">
    <div class="menu-content">
      <button class="close-menu" id="close-menu" aria-label="Close menu">×</button>
      <div class="menu-brand">🦀 Crab Guy</div>
      <nav class="menu-nav">
        <a href="#" class="menu-link active">Chat</a>
        <a href="#" class="menu-link">Settings</a>
        <a href="/logout" class="menu-link">Logout</a>
      </nav>
      <div class="menu-section">
        <div class="menu-history-header">
          <h4>History</h4>
          <button class="new-chat-btn-mobile" id="new-chat-btn-mobile">+ New</button>
        </div>
        <div class="history-list-mobile" id="history-list-mobile">
          <p class="history-empty">No conversations yet.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Existing frontend JS unchanged — it will call /chat for compatibility with the server.

    // ── State ──────────────────────────────────────────────────────────────
    let chatHistory = []; // array of { role, text } for current session
    let conversations = []; // saved conversations [ { id, title, messages[] } ]
    let activeConvId = null;

    // ── DOM refs ───────────────────────────────────────────────────────────
    const chatWindow       = document.getElementById("chat-window");
    const promptInput      = document.getElementById("prompt-input");
    const sendBtn          = document.getElementById("send-btn");
    const menuToggle       = document.getElementById("menu-toggle");
    const menuOverlay      = document.getElementById("menu-overlay");
    const closeMenuBtn     = document.getElementById("close-menu");
    const historyList      = document.getElementById("history-list");
    const historyListMobile= document.getElementById("history-list-mobile");
    const historyBadge     = document.getElementById("history-badge");
    const newChatBtn       = document.getElementById("new-chat-btn");
    const newChatBtnMobile = document.getElementById("new-chat-btn-mobile");

    // ── Helpers ────────────────────────────────────────────────────────────
    function scrollToBottom() {
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function addMessage(text, type) {
      const msg = document.createElement("div");
      msg.classList.add("chat-message", type);
      const avatar = type === "user" ? "You" : "🦀";
      msg.innerHTML = `
        <div class="message-avatar">${avatar}</div>
        <div class="message-content"><p>${text}</p></div>
      `;
      chatWindow.appendChild(msg);
      scrollToBottom();
      chatHistory.push({ role: type, text });
    }

    function addTypingIndicator() {
      const el = document.createElement("div");
      el.classList.add("chat-message", "bot", "typing-indicator");
      el.id = "typing-indicator";
      el.innerHTML = `
        <div class="message-avatar">🦀</div>
        <div class="message-content"><span class="dots"><span></span><span></span><span></span></span></div>
      `;
      chatWindow.appendChild(el);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const el = document.getElementById("typing-indicator");
      if (el) el.remove();
    }

    // ── History rendering ──────────────────────────────────────────────────
    function renderHistory() {
      historyBadge.textContent = conversations.length;

      const empty = conversations.length === 0
        ? '<p class="history-empty">No conversations yet.</p>'
        : '';

      [historyList, historyListMobile].forEach(list => {
        list.innerHTML = empty;
      });

      conversations.forEach(conv => {
        [historyList, historyListMobile].forEach((list, i) => {
          const item = document.createElement("button");
          item.classList.add(i === 0 ? "history-item" : "history-item-mobile");
          if (conv.id === activeConvId) item.classList.add("active");
          item.textContent = conv.title;
          item.addEventListener("click", () => loadConversation(conv.id));
          list.appendChild(item);
        });
      });
    }

    function saveCurrentConversation() {
      if (chatHistory.length === 0) return;
      const title = chatHistory.find(m => m.role === "user")?.text.slice(0, 32) || "Conversation";
      if (activeConvId) {
        const conv = conversations.find(c => c.id === activeConvId);
        if (conv) conv.messages = [...chatHistory];
      } else {
        activeConvId = Date.now();
        conversations.unshift({ id: activeConvId, title: title + "…", messages: [...chatHistory] });
      }
      renderHistory();
    }

    function loadConversation(id) {
      const conv = conversations.find(c => c.id === id);
      if (!conv) return;
      activeConvId = id;
      chatHistory = [...conv.messages];
      chatWindow.innerHTML = "";
      chatHistory.forEach(m => {
        const msg = document.createElement("div");
        msg.classList.add("chat-message", m.role);
        const avatar = m.role === "user" ? "You" : "🦀";
        msg.innerHTML = `<div class="message-avatar">${avatar}</div><div class="message-content"><p>${m.text}</p></div>`;
        chatWindow.appendChild(msg);
      });
      scrollToBottom();
      renderHistory();
      menuOverlay.classList.remove("active");
    }

    function startNewChat() {
      saveCurrentConversation();
      activeConvId = null;
      chatHistory = [];
      chatWindow.innerHTML = "";
      addMessage("Hello! I'm Intelligent Crab Guy 🦀. Ask me anything!", "bot");
      renderHistory();
      menuOverlay.classList.remove("active");
    }

    // ── Send message ───────────────────────────────────────────────────────
    async function sendMessage() {
      const userText = promptInput.value.trim();
      if (!userText) return;

      addMessage(userText, "user");
      promptInput.value = "";
      sendBtn.disabled = true;
      addTypingIndicator();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userText })
        });

        removeTypingIndicator();

        if (!res.ok) {
          let errorText = await res.text();
          try { errorText = JSON.parse(errorText).error || errorText; } catch (_) {}
          addMessage(`Server error ${res.status}: ${errorText}`, "bot");
          return;
        }

        const data = await res.json();
        addMessage(data.reply || "No reply from server.", "bot");
        saveCurrentConversation();

      } catch (err) {
        removeTypingIndicator();
        addMessage(`Network error: ${err.message}`, "bot");
      } finally {
        sendBtn.disabled = false;
      }
    }

    // ── Event listeners ────────────────────────────────────────────────────
    sendBtn.addEventListener("click", sendMessage);

    promptInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    menuToggle.addEventListener("click", () => menuOverlay.classList.add("active"));
    closeMenuBtn.addEventListener("click", () => menuOverlay.classList.remove("active"));
    menuOverlay.addEventListener("click", e => {
      if (e.target === menuOverlay) menuOverlay.classList.remove("active");
    });

    newChatBtn.addEventListener("click", startNewChat);
    newChatBtnMobile.addEventListener("click", startNewChat);

    // ── Init ───────────────────────────────────────────────────────────────
    addMessage("Hello! I'm Intelligent Crab Guy 🦀. Ask me anything!", "bot");
    renderHistory();
  </script>
</body>
</html>
